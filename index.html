<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holy Ink</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#0d0d0d;
    --ink-2:#1a1a1a;
    --parchment:#f4efe4;
    --brand-green:#95C11F;
    --gold:#E2B025;
    --grey:#8f8f8f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(149,193,31,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(226,176,37,0.10), transparent 45%);
    color: var(--parchment);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }
  .card{ width:100%; max-width:360px; text-align:center; }
  .logo-slot{
    width:120px; height:120px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--ink-2);
    border: 1px solid rgba(226,176,37,0.35);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .logo-slot img{ width:78%; height:78%; object-fit:contain; }
  .logo-slot .placeholder{
    font-family:'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--gold);
    letter-spacing:0.03em;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:16px;
    color: var(--gold);
    margin-bottom:4px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:56px;
    letter-spacing:0.04em;
  }
  .tagline{
    font-size:12px;
    color:var(--grey);
    letter-spacing:0.08em;
    margin-top:6px;
    margin-bottom:34px;
  }
  .links{ display:flex; flex-direction:column; gap:12px; }
  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--ink-2);
    border:1px solid rgba(244,239,228,0.14);
    color: var(--parchment);
    text-decoration:none;
    padding:13px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.01em;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  a.link:hover{ border-color: var(--gold); background:#232028; transform: translateY(-1px); }
  a.link .ic{
    width:34px; height:34px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  a.link .ic svg{ width:19px; height:19px; }
  a.link .label{ text-align:left; }
  a.link .label .net{ display:block; font-size:13.5px; font-weight:600; }
  a.link .label .handle{ display:block; font-size:11.5px; color:var(--grey); margin-top:1px; }

  .ic.ig{ background: radial-gradient(circle at 30% 110%, #ffdb73 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .ic.fb{ background:#1877F2; }
  .ic.wa{ background:#25D366; }
  .ic.tt{ background:#000000; }

  footer{ margin-top:34px; font-size:10.5px; color:var(--grey); letter-spacing:0.05em; }
</style>
</head>
